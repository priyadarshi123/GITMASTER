# Symbols the dashboard tracks. Only `enabled` entries are fetched, so trimming
# this list directly reduces API calls. Order = display rank (stocks are listed
# roughly by Nifty 50 weight). Edits are picked up on the next refresh.
#
# Fields
#   symbol       NSE symbol (as on NSE / Angel One, without -EQ)
#   name         display name
#   sector       sector chip on the dashboard
#   enabled      false = skip entirely (default true)
#   expiries     how many upcoming expiries to load in the option chain (default 1)
#   yahoo        Yahoo Finance ticker (fallback data source; default <symbol>.NS)
#   nse_index    NSE index name: history + quotes come from NSE instead of Yahoo
#   angel_token  Angel One instrument token (only needed for indices; stocks are
#                looked up automatically from Angel's instrument master)

indices:
  - { symbol: NIFTY,      name: Nifty 50,          sector: Index, enabled: true,  expiries: 2, yahoo: "^NSEI",                angel_token: "99926000" }
  - { symbol: BANKNIFTY,  name: Nifty Bank,        sector: Index, enabled: true,  expiries: 1, yahoo: "^NSEBANK",             angel_token: "99926009" }
  # Yahoo has no history for these two, so they come from NSE directly
  - { symbol: FINNIFTY,   name: Nifty Fin Service,   sector: Index, enabled: true, expiries: 1, nse_index: NIFTY FINANCIAL SERVICES, angel_token: "99926037" }
  - { symbol: MIDCPNIFTY, name: Nifty Midcap Select, sector: Index, enabled: true, expiries: 1, nse_index: NIFTY MIDCAP SELECT,      angel_token: "99926074" }

